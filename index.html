<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Makan mana?</title>
<style>
  :root {
    --bg: #FBF6EF;
    --card: #FFFFFF;
    --ink: #2C231C;
    --ink-soft: #7A6E60;
    --coral: #D85A30;
    --coral-dark: #993C1D;
    --amber: #EF9F27;
    --line: #E8DFD1;
    --good: #3B6D11;
    --bad: #B23A3A;
    --maybe: #C98A1E;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  header h1 {
    font-family: Georgia, "Times New Roman", serif;
    font-size: 26px;
    font-weight: 700;
    margin: 0 0 4px;
    color: var(--coral-dark);
  }
  header p { font-size: 13px; color: var(--ink-soft); margin: 0; }

  .card {
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--line);
    padding: 18px;
    margin-bottom: 16px;
  }
  .card h2 { font-size: 14px; margin: 0 0 12px; color: var(--ink-soft); font-weight: 600; letter-spacing: .02em; text-transform: uppercase; }

  label { display: block; font-size: 12px; color: var(--ink-soft); margin: 10px 0 4px; }
  input[type=text], textarea, select {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 9px 10px;
    font-size: 14px;
    font-family: inherit;
    background: #FEFCF9;
    color: var(--ink);
  }
  textarea { resize: vertical; min-height: 44px; }

  .stars { display: flex; gap: 6px; font-size: 26px; margin-top: 2px; }
  .stars span { cursor: pointer; color: var(--line); transition: color .1s; }
  .stars span.active { color: var(--amber); }

  .verdict-group { display: flex; flex-direction: column; gap: 8px; margin-top: 6px; }
  .verdict-option {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 8px 10px;
    cursor: pointer;
  }
  .verdict-option input { width: auto; margin: 0; }

  button.primary {
    margin-top: 14px;
    width: 100%;
    background: var(--coral);
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  button.primary:active { transform: scale(0.99); }

  .filters { display: flex; gap: 8px; margin-bottom: 14px; }
  .filters select { flex: 1; }

  .entry {
    background: var(--card);
    border: 1px solid var(--line);
    border-left: 4px solid var(--amber);
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 10px;
    position: relative;
  }
  .entry.verdict-again { border-left-color: var(--good); }
  .entry.verdict-maybe { border-left-color: var(--maybe); }
  .entry.verdict-no { border-left-color: var(--bad); }
  .entry-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .entry-name { font-size: 15px; font-weight: 700; margin: 0; }
  .entry-stars { font-size: 13px; color: var(--amber); white-space: nowrap; }
  .entry-meta { font-size: 11px; color: var(--ink-soft); margin: 3px 0 6px; }
  .entry-notes { font-size: 13px; color: var(--ink); line-height: 1.45; margin: 0; }
  .entry-tag {
    display: inline-block;
    font-size: 10px;
    color: var(--coral-dark);
    background: #FAECE7;
    border-radius: 5px;
    padding: 2px 7px;
    margin-top: 6px;
  }
  .del {
    position: absolute;
    top: 10px;
    right: 10px;
    font-size: 16px;
    color: var(--ink-soft);
    cursor: pointer;
    line-height: 1;
  }

  .empty { text-align: center; color: var(--ink-soft); font-size: 13px; padding: 30px 10px; }
  .status { text-align: center; font-size: 12px; color: var(--ink-soft); margin-bottom: 8px; }
</style>
</head>
<body>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<div class="wrap">
  <header>
    <h1>Makan mana kamu?</h1>
    <p>Your running log of what's actually good around the world</p>
  </header>

  <div class="card">
    <h2>Log a place</h2>
    <label for="name">Apa nama kedai?</label>
    <input type="text" id="name" placeholder=>

    <label for="submitter">Apa nama?</label>
    <input type="text" id="submitter" placeholder=>

    <label>Rating</label>
    <div class="stars" id="stars">
      <span data-v="1">★</span><span data-v="2">★</span><span data-v="3">★</span><span data-v="4">★</span><span data-v="5">★</span>
    </div>

    <label for="tag">Tag</label>
    <select id="tag">
      <option>Noodles</option>
      <option>Seafood</option>
      <option>Local / kampung</option>
      <option>Cafe</option>
      <option>Night market</option>
      <option>Western</option>
      <option>Dessert</option>
      <option>Other</option>
    </select>

    <label for="notes">Notes</label>
    <textarea id="notes" placeholder="Apa ko makan?"></textarea>

    <label>Verdict</label>
    <div class="verdict-group" id="verdictGroup">
      <label class="verdict-option">
        <input type="radio" name="verdict" value="again" checked> Would go again
      </label>
      <label class="verdict-option">
        <input type="radio" name="verdict" value="maybe"> See lah first
      </label>
      <label class="verdict-option">
        <input type="radio" name="verdict" value="no"> Hell NO!
      </label>
    </div>

    <button class="primary" id="saveBtn">Save entry</button>
  </div>

  <div class="filters">
    <select id="filterTag"><option value="">All tags</option></select>
    <select id="sortBy">
      <option value="newest">Newest first</option>
      <option value="rating">Highest rated</option>
    </select>
  </div>

  <div id="status" class="status"></div>
  <div id="list"></div>
</div>

<script>
  // ---- Firebase setup ----
  var firebaseConfig = {
    apiKey: "AIzaSyBiwBK4A1nWC9gfOXYDchfZNiXaaezynpo",
    authDomain: "makan-6f26f.firebaseapp.com",
    databaseURL: "https://makan-6f26f-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "makan-6f26f",
    storageBucket: "makan-6f26f.firebasestorage.app",
    appId: "1:465005440964:web:a8a5810f6ec18dd78e7e91"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.database().ref('makan-entries');

  var entries = [];
  var currentRating = 0;
  var verdictLabels = { again: 'would go again', maybe: 'see lah first', no: 'hell no' };

  firebase.auth().signInAnonymously().catch(function(err) {
    setStatus('Could not connect — auth error.');
  });

  var starsEl = document.getElementById('stars');
  starsEl.querySelectorAll('span').forEach(function(s) {
    s.addEventListener('click', function() {
      currentRating = parseInt(s.getAttribute('data-v'));
      renderStars();
    });
  });
  function renderStars() {
    starsEl.querySelectorAll('span').forEach(function(s) {
      s.classList.toggle('active', parseInt(s.getAttribute('data-v')) <= currentRating);
    });
  }

  function setStatus(msg) {
    document.getElementById('status').textContent = msg || '';
  }

  function loadEntries() {
    setStatus('Connecting...');
    db.on('value', function(snapshot) {
      var val = snapshot.val();
      entries = val ? JSON.parse(val) : [];
      setStatus('');
      populateTagFilter();
      render();
    }, function(err) {
      setStatus('Could not connect — check your Firebase config and database rules.');
    });
  }

  async function saveEntries() {
    try {
      await db.set(JSON.stringify(entries));
    } catch (e) {
      setStatus('Could not save — try again.');
    }
  }

  document.getElementById('saveBtn').addEventListener('click', async function() {
    var name = document.getElementById('name').value.trim();
    if (!name) { setStatus('Add a place or dish name first.'); return; }
    if (currentRating === 0) { setStatus('Tap some stars to rate it.'); return; }
    var verdictInput = document.querySelector('input[name="verdict"]:checked');
    var entry = {
      id: 'e' + Date.now(),
      name: name,
      submitter: document.getElementById('submitter').value.trim(),
      rating: currentRating,
      tag: document.getElementById('tag').value,
      notes: document.getElementById('notes').value.trim(),
      verdict: verdictInput ? verdictInput.value : 'again',
      date: new Date().toISOString()
    };
    entries.unshift(entry);
    document.getElementById('name').value = '';
    document.getElementById('submitter').value = '';
    document.getElementById('notes').value = '';
    document.querySelector('input[name="verdict"][value="again"]').checked = true;
    currentRating = 0;
    renderStars();
    populateTagFilter();
    render();
    setStatus('Saved.');
    await saveEntries();
    setTimeout(function() { setStatus(''); }, 1500);
  });

  function populateTagFilter() {
    var sel = document.getElementById('filterTag');
    var current = sel.value;
    var tags = Array.from(new Set(entries.map(function(e) { return e.tag; })));
    sel.innerHTML = '<option value="">All tags</option>' + tags.map(function(t) {
      return '<option value="' + t + '">' + t + '</option>';
    }).join('');
    sel.value = current;
  }

  document.getElementById('filterTag').addEventListener('change', render);
  document.getElementById('sortBy').addEventListener('change', render);

  function render() {
    var list = document.getElementById('list');
    var filterTag = document.getElementById('filterTag').value;
    var sortBy = document.getElementById('sortBy').value;

    var shown = entries.filter(function(e) { return !filterTag || e.tag === filterTag; });
    shown = shown.slice();
    if (sortBy === 'rating') {
      shown.sort(function(a, b) { return b.rating - a.rating; });
    } else {
      shown.sort(function(a, b) { return new Date(b.date) - new Date(a.date); });
    }

    if (shown.length === 0) {
      list.innerHTML = '<div class="empty">No entries yet. Log your first makan above.</div>';
      return;
    }

    list.innerHTML = shown.map(function(e) {
      var d = new Date(e.date);
      var dateStr = d.toLocaleDateString(undefined, { day: 'numeric', month: 'short', year: 'numeric' });
      var stars = '★'.repeat(e.rating) + '☆'.repeat(5 - e.rating);
      var verdict = e.verdict || 'again';
      return '<div class="entry verdict-' + verdict + '" data-id="' + e.id + '">' +
        '<span class="del" data-del="' + e.id + '" title="Delete">×</span>' +
        '<div class="entry-top"><p class="entry-name">' + escapeHtml(e.name) + '</p>' +
        '<span class="entry-stars">' + stars + '</span></div>' +
        '<div class="entry-meta">' + dateStr + (e.submitter ? ' · added by ' + escapeHtml(e.submitter) : '') + ' · ' + verdictLabels[verdict] + '</div>' +
        (e.notes ? '<p class="entry-notes">' + escapeHtml(e.notes) + '</p>' : '') +
        '<span class="entry-tag">' + escapeHtml(e.tag) + '</span>' +
        '</div>';
    }).join('');

    list.querySelectorAll('[data-del]').forEach(function(el) {
      el.addEventListener('click', async function() {
        var id = el.getAttribute('data-del');
        entries = entries.filter(function(e) { return e.id !== id; });
        populateTagFilter();
        render();
        await saveEntries();
      });
    });
  }

  function escapeHtml(str) {
    var d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  firebase.auth().onAuthStateChanged(function(user) {
    if (user) loadEntries();
  });
</script>
</body>
</html>
